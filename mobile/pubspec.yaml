name: vimj_attendance
description: VIMJ Studio Attendance System - Coach mobile app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  http: ^1.2.2
  shared_preferences: ^2.3.2
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  fl_chart: ^0.69.0
  connectivity_plus: ^6.0.5
  flutter_local_notifications: ^17.2.3
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  share_plus: ^10.1.2
  intl: ^0.19.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Run `dart run flutter_launcher_icons` after the native android/ios projects
  # are generated (`flutter create .`) to bake the Academy logo in as the real
  # app icon; until then the app uses Flutter's default launcher icon.
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: "assets/images/logo.jpeg"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpeg

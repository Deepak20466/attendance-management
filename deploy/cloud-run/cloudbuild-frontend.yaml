steps:
  - name: node:24-alpine
    dir: frontend
    entrypoint: sh
    args:
      - -ceu
      - |
        case "${_IMAGE_TAG}" in *[!a-f0-9]*|'') echo 'A full commit SHA image tag is required.' >&2; exit 2 ;; esac
        test "${#_IMAGE_TAG}" -eq 40 || { echo 'A full commit SHA image tag is required.' >&2; exit 2; }
        case "${_API_BASE_URL}" in https://*) ;; *) echo 'An HTTPS API origin is required.' >&2; exit 2 ;; esac
        case "${_API_BASE_URL}" in *onrender.com*|*.invalid*) echo 'Blocked or placeholder API origin.' >&2; exit 2 ;; esac
        npm ci
        npm run lint
        npm run build
  - name: gcr.io/cloud-builders/docker
    dir: frontend
    args:
      - build
      - -f
      - Dockerfile.cloudrun
      - --build-arg
      - VITE_API_BASE_URL=$_API_BASE_URL
      - -t
      - ${_IMAGE_REPO}:${_IMAGE_TAG}
      - .
images:
  - ${_IMAGE_REPO}:${_IMAGE_TAG}
substitutions:
  _IMAGE_REPO: asia-south1-docker.pkg.dev/vimj-academy/cloud-run-source-deploy/vimj-frontend
  _API_BASE_URL: https://api-base-url-required.invalid
  _IMAGE_TAG: required-at-submit
options:
  logging: CLOUD_LOGGING_ONLY

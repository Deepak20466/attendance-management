name: Build and publish mobile APKs

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build split APKs
        working-directory: mobile
        run: flutter build apk --release --split-per-abi
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Automated Android release build."
      - name: Upload APKs to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" mobile/build/app/outputs/flutter-apk/*.apk --clobber

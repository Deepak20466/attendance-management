name: Validate application changes

on:
  pull_request:
  push:
    branches:
      - master
      - cloud-run-safety-audit
      - vimj-production-recovery

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run backend regression and production-safety tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Compile backend modules
        working-directory: backend
        run: python -m compileall -q app scripts alembic

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build and lint frontend
        working-directory: frontend
        run: |
          npm run build
          npm run lint

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Run Flutter tests and analysis
        working-directory: mobile
        run: |
          flutter pub get
          flutter test
          flutter analyze --no-fatal-infos
      - name: Reject the blocked Render API hostname
        shell: bash
        run: |
          if grep -R -n --exclude-dir=.git --exclude=AGENTS.md --exclude=REQUESTED_CHANGES.md \
            'vimj-backend.onrender.com' mobile/lib mobile/android; then
            echo 'Blocked Render API hostname remains in mobile runtime source.' >&2
            exit 1
          fi
      - name: Prepare hosted Gradle wrapper for recovery preview build
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/vimj-production-recovery' }}
        working-directory: mobile/android
        run: sed -i 's#^distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-all.zip#' gradle/wrapper/gradle-wrapper.properties
      - name: Create temporary non-production preview signing key
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/vimj-production-recovery' }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          key_path="$RUNNER_TEMP/vimj-preview-release.jks"
          password="$(openssl rand -hex 32)"
          keytool -genkeypair -noprompt -storetype JKS -keystore "$key_path" \
            -storepass "$password" -keypass "$password" -alias vimj-preview \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=VIMJ Non-production Preview, OU=Temporary CI Key'
          chmod 600 "$key_path"
          echo "::add-mask::$password"
          {
            echo "ANDROID_KEYSTORE_PATH=$key_path"
            echo "ANDROID_KEYSTORE_PASSWORD=$password"
            echo 'ANDROID_KEY_ALIAS=vimj-preview'
            echo "ANDROID_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Build optimized ARM64 release-mode preview APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/vimj-production-recovery' }}
        working-directory: mobile
        env:
          API_BASE_URL: https://api-base-url-required.invalid
          VIMJ_PREVIEW_APK: 'true'
        run: >-
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          --obfuscate --split-debug-info="$RUNNER_TEMP/vimj-preview-symbols"
          --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Verify preview APK and record checksum
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/vimj-production-recovery' }}
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$build_tools"
          "$build_tools/apksigner" verify --verbose "$apk" >/dev/null
          package_name="$("$build_tools/aapt" dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          test "$package_name" = 'com.vimjstudio.vimj_attendance.preview'
          apk_size="$(stat -c%s "$apk")"
          printf 'Package: %s\nABI: arm64-v8a\nMode: Flutter release with obfuscation and split debug symbols\nAPI: reserved non-production .invalid host\nSigning: temporary per-run non-production key; not a production release\nAPK size: %s bytes\n' \
            "$package_name" "$apk_size" > build/app/outputs/flutter-apk/PREVIEW-INFO.txt
          sha256sum "$apk" > build/app/outputs/flutter-apk/SHA256SUMS.txt
          printf 'Optimized preview APK size: %s bytes\n' "$apk_size"
          if (( apk_size > 31457280 )); then
            echo 'Preview APK exceeds the 30 MiB target; build remains available for inspection.'
          fi
      - name: Upload short-lived preview APK artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/vimj-production-recovery' }}
        uses: actions/upload-artifact@v4
        with:
          name: vimj-mobile-preview-arm64-${{ github.sha }}
          path: |
            mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile/build/app/outputs/flutter-apk/PREVIEW-INFO.txt
            mobile/build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Delete temporary preview signing key
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/vimj-production-recovery' }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/vimj-preview-release.jks" "$RUNNER_TEMP/vimj-preview-symbols"/*

  cloudrun-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image locally without pushing
        run: docker build -f backend/Dockerfile.cloudrun -t vimj-backend:ci backend
      - name: Build frontend image locally without pushing
        run: docker build -f frontend/Dockerfile.cloudrun --build-arg VITE_API_BASE_URL=https://api-base-url-required.invalid -t vimj-frontend:ci frontend

  deployment-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Cloud Shell scripts, embedded Python, and deployment YAML
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          bash -n deploy/cloud-run/*.sh
          python -m py_compile deploy/cloud-run/*.py backend/scripts/check_database_readonly.py
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          for shell_script in Path("deploy/cloud-run").glob("*.sh"):
              source = shell_script.read_text(encoding="utf-8")
              blocks = re.findall(r"<<'PY'\s*\r?\n(.*?)\r?\nPY(?=\r?$)", source, re.DOTALL | re.MULTILINE)
              for index, block in enumerate(blocks, 1):
                  compile(block, f"{shell_script} heredoc {index}", "exec")

          for yaml_file in [
              Path(".github/workflows/ci.yml"),
              Path(".github/workflows/release-mobile.yml"),
              Path("deploy/cloud-run/cloudbuild-backend.yaml"),
              Path("deploy/cloud-run/cloudbuild-frontend.yaml"),
          ]:
              yaml.compose(yaml_file.read_text(encoding="utf-8"))
          PY
